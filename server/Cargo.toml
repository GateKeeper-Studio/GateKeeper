[package]
name = "web-api"
version = "0.1.0"
edition = "2024"
# The crate ships extra CLI binaries (e.g. create_admin) under src/bin/, which makes
# bare `cargo run` ambiguous. Pin the default to the server so `cargo run` still
# launches it; use `cargo run --bin create_admin` for the others.
default-run = "web-api"
# Proprietary, never published to a registry. Also signals cargo-deny to skip
# license checks on our own crate (deny.toml [licenses] private.ignore).
publish = false

[dependencies]
# ── HTTP framework ─────────────────────────────────────────────────────────────
axum = "0.8.9"

# ── Async runtime ──────────────────────────────────────────────────────────────
# Only what the server uses: the multi-threaded runtime, #[tokio::main]/#[tokio::test],
# TCP listeners, SIGTERM handling, timers, sync primitives (Mutex, Semaphore, watch)
# and the blocking pool (spawn_blocking, part of `rt`).
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }

# ── Async traits ─────────────────────────────────────────────────────────────
# Native `async fn` in traits is not dyn-compatible, and every port is used as
# `Arc<dyn Trait>`, so the ports keep async-trait.
async-trait = "0.1.89"

# ── Serialization ─────────────────────────────────────────────────────────────
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

# ── Middleware layer ───────────────────────────────────────────────────────────
tower = "0.5.3"
tower-http = { version = "0.6.11", features = ["cors", "trace", "compression-gzip", "timeout"] }

# ── Database ──────────────────────────────────────────────────────────────────
# Compile-time-checked queries (`sqlx::query!`); the `.sqlx/` cache lets builds run
# offline (SQLX_OFFLINE=true). Regenerate with `cargo sqlx prepare -- --lib`.
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "chrono", "uuid", "json"] }

# ── Date/time ─────────────────────────────────────────────────────────────────
chrono = { version = "0.4.44", features = ["serde"] }

# ── IDs ───────────────────────────────────────────────────────────────────────
uuid = { version = "1.23.2", features = ["v4","v7", "serde"] }

# ── Error handling ────────────────────────────────────────────────────────────
thiserror = "2.0.18"


# ── Observability ─────────────────────────────────────────────────────────────
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }


# ── Validation ────────────────────────────────────────────────────────────────
validator = { version = "0.20.0", features = ["derive"] }

# ── Config ────────────────────────────────────────────────────────────────────
# dotenvy loads .env in development; everything else is read once by AppConfig.
dotenvy = "0.15.7"

# ── Password hashing ──────────────────────────────────────────────────────────
# Argon2id, behind the `PasswordHasher` port (bounded, on the blocking pool).
argon2 = { version = "0.5.3", features = ["password-hash"] }
rand_core = { version = "0.6", features = ["getrandom"] }

# ── JWT ───────────────────────────────────────────────────────────────────────
# v10 requires opting into exactly one crypto backend; `rust_crypto` is pure-Rust
# (RSA/EC/Ed25519) with no C build deps. Without it, encode/decode panics at runtime
# ("Could not automatically determine the process-level CryptoProvider").
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }
rand = "0.9"

# ── Signing-key generation ──────────────────────────────────────────────────────
# p256 generates the per-tenant ECDSA P-256 (ES256) keypairs the OAuth/OIDC
# provider signs JWTs with: `pem` exports the PKCS#8 private key that jsonwebtoken
# loads, `jwk` exports the public half as a JWK for the /jwks.json endpoint.
p256 = { version = "0.13", features = ["pem", "jwk"] }

# ── OAuth crypto primitives ─────────────────────────────────────────────────────
# sha2 hashes opaque tokens (codes, refresh tokens) before they touch the DB;
# base64 (URL-safe) encodes random tokens and PKCE challenges; hex renders the
# SHA-256 digests we persist; subtle gives constant-time comparison so token/PKCE
# checks don't leak bytes through timing.
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
subtle = "2.6"

# ── Secrets at rest ──────────────────────────────────────────────────────────
# AES-256-GCM (AEAD) encrypts SMTP provider passwords before they touch the DB;
# the master key comes from config (EMAIL_ENCRYPTION_KEY) and decryption happens
# only at send time.
aes-gcm = "0.10"

# ── Outbound email (SMTP) ────────────────────────────────────────────────────
# lettre is the async SMTP client used to deliver verification codes / reset
# links through a tenant's configured SMTP provider. rustls (no OpenSSL) for TLS.
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "pool", "hostname", "tokio1-rustls-tls"] }

# ── Outbound HTTP (external identity providers) ──────────────────────────────
# reqwest calls Google/GitHub token + userinfo endpoints during social login.
# rustls (no OpenSSL) to match the rest of the TLS stack; `json` for (de)serializing
# the provider responses.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base32 = "0.5"
hmac = "0.12"
sha1 = "0.10"
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }
mrml = "6.0.1"
html2text = "0.17.1"
lol_html = "3.0.0"
maxminddb = "0.29.0"

# ── Rate limiting ────────────────────────────────────────────────────────────
# GCRA (leaky-bucket) rate limiting as a Tower layer, keyed on client IP. An IdP
# without it lets an attacker brute-force /admin/login and the MFA verification
# endpoints at network speed. default-features is off deliberately: the default
# set pulls in `tonic` (a whole gRPC stack) for its interceptor, which this
# service has no use for.
tower_governor = { version = "0.8", default-features = false, features = ["axum", "tracing"] }

# ── Metrics ──────────────────────────────────────────────────────────────────
# An IdP with no metrics gives you no way to alert on token-issuance latency,
# error rate, pool exhaustion or audit-write failures — all of which were only
# visible by grepping text logs. `metrics` is the facade; the Prometheus exporter
# renders the registry.
#
# default-features is off deliberately: the defaults start their own HTTP listener
# (and pull a push-gateway/protobuf stack with it). The registry is rendered by
# `GET /metrics` on the existing Axum router instead, so it inherits the same
# bind address, timeouts and TLS termination as everything else.
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.17", default-features = false }

[features]
# Repository tests against a real Postgres (tests/db_*.rs). Off by default so
# `cargo test` needs no running database; CI enables it via --all-features.
db-tests = []

[profile.release]
# This service's hot path is CPU-bound crypto — Argon2id on every login, ECDSA
# P-256 signing on every token issued — so cross-crate inlining is worth the
# longer build. `strip` drops symbols the container has no use for.
lto = "thin"
codegen-units = 1
strip = "symbols"
# Keep overflow checks on in release. This is an identity provider: a silent wrap
# in a counter or expiry calculation is worse than a crash, and the cost is
# negligible next to the crypto above.
overflow-checks = true

[dev-dependencies]
# fake generates realistic random data (names, emails, etc.) for test factories.
# rand is the underlying RNG engine it uses.
fake = { version = "4", features = ["derive"] }
rand = "0.9"
