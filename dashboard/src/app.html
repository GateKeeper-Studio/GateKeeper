<!doctype html>

<!-- lang/dir are set from the active locale on start (routes/+layout.svelte). -->
<html lang="en" dir="ltr">
	<head>
		<meta charset="utf-8" />

		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<meta name="text-scale" content="scale" />
		<!--
			The saved light/dark choice (mode-watcher's), applied before the first paint
			so a dark-mode visitor never sees a white frame. The identity provider adds
			this inline script's hash to the page's CSP like the SvelteKit bootstrap's.
		-->
		<script>
			try {
				var m = localStorage.getItem('mode-watcher-mode');
				if (
					m === 'dark' ||
					((!m || m === 'system') && matchMedia('(prefers-color-scheme: dark)').matches)
				) {
					document.documentElement.classList.add('dark');
					document.documentElement.style.colorScheme = 'dark';
				}
			} catch (e) {}
		</script>
		<!--
			Boot shell: painted with the HTML, before any JavaScript arrives, and removed
			by routes/+layout.svelte once the app has mounted. The server marks hosted
			login pages with html[data-boot="auth"] to get the sign-in skeleton; every
			other page gets a plain background with a spinner (the console's splash takes
			over from it). Plain CSS only: this page has no stylesheet yet.
		-->
		<style>
			#gk-boot {
				position: fixed;
				inset: 0;
				z-index: 300;
				display: grid;
				place-items: center;
				background: #fff;
			}
			.dark #gk-boot {
				background: #0a0a0a;
			}
			#gk-boot .gk-spin {
				width: 28px;
				height: 28px;
				border-radius: 50%;
				border: 3px solid rgba(127, 127, 127, 0.25);
				border-top-color: rgba(127, 127, 127, 0.8);
				animation: gk-spin 0.9s linear infinite;
			}
			#gk-boot .gk-auth {
				display: none;
			}
			[data-boot='auth'] #gk-boot {
				display: flex;
				place-items: initial;
			}
			[data-boot='auth'] #gk-boot .gk-spin {
				display: none;
			}
			[data-boot='auth'] #gk-boot .gk-auth {
				display: flex;
				width: 100%;
			}
			.gk-auth .gk-panel {
				display: none;
				flex: 1;
				background: #181818;
			}
			.gk-auth .gk-main {
				flex: 1;
				display: grid;
				place-items: center;
				padding: 24px;
			}
			.gk-auth .gk-form {
				width: 100%;
				max-width: 350px;
				display: grid;
				gap: 10px;
			}
			.gk-auth .gk-bar {
				height: 14px;
				border-radius: 999px;
				background: #ececec;
				animation: gk-pulse 1.4s ease-in-out infinite;
			}
			.dark .gk-auth .gk-bar {
				background: #232323;
			}
			.gk-auth .gk-title {
				height: 26px;
				width: 75%;
				margin: 0 auto;
			}
			.gk-auth .gk-sub {
				width: 60%;
				margin: 0 auto 18px;
			}
			.gk-auth .gk-label {
				width: 22%;
				height: 12px;
				margin-top: 8px;
			}
			.gk-auth .gk-input {
				height: 36px;
			}
			.gk-auth .gk-button {
				height: 34px;
				margin-top: 14px;
			}
			@media (min-width: 1024px) {
				.gk-auth .gk-panel {
					display: block;
				}
			}
			@keyframes gk-spin {
				to {
					transform: rotate(360deg);
				}
			}
			@keyframes gk-pulse {
				50% {
					opacity: 0.55;
				}
			}
			@media (prefers-reduced-motion: reduce) {
				#gk-boot * {
					animation: none !important;
				}
			}
		</style>
		<noscript
			><style>
				#gk-boot {
					display: none !important;
				}
			</style></noscript
		>
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div id="gk-boot" aria-hidden="true">
			<div class="gk-spin"></div>
			<div class="gk-auth">
				<div class="gk-panel"></div>
				<div class="gk-main">
					<div class="gk-form">
						<div class="gk-bar gk-title"></div>
						<div class="gk-bar gk-sub"></div>
						<div class="gk-bar gk-label"></div>
						<div class="gk-bar gk-input"></div>
						<div class="gk-bar gk-label"></div>
						<div class="gk-bar gk-input"></div>
						<div class="gk-bar gk-button"></div>
						<div class="gk-bar gk-button"></div>
					</div>
				</div>
			</div>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
